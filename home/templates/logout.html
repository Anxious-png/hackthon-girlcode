{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block title %}Logout{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card p-4 shadow-lg" style="backdrop-filter: blur(12px); background: rgba(255,255,255,0.1); border-radius: 15px;">
            <h3 class="text-center mb-4">Confirm Logout</h3>
            <p class="text-center text-light">
                Are you sure you want to log out?
            </p>
            <form method="POST">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger w-100 mb-2">Logout</button>
                <a href="{% url 'dashboard' %}" class="btn btn-secondary w-100">Cancel</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
