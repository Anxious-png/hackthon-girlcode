<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Silent Guard{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Global Background */
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #141e30, #243b55);
            min-height: 100vh;
            color: #f8f9fa;
        }

        /* Navbar Glass Effect */
        .navbar {
            background: rgba(0, 0, 0, 0.6) !important;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }

        .navbar-brand {
            font-weight: bold;
            font-size: 1.5rem;
        }

        /* Main Container Styling */
        .main-container {
            margin-top: 80px;
            padding: 20px;
        }

        /* Flash messages */
        .alert {
            border-radius: 12px;
            font-weight: 500;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 15px;
            margin-top: 30px;
            color: #ccc;
            font-size: 0.9rem;
        }

        footer a {
            color: #ffc107;
            text-decoration: none;
        }

        footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark fixed-top">
    <div class="container">
        <a class="navbar-brand" href="#">🚨 Silent Guard</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="{% url 'savings_dashboard' %}">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="{% url 'set_savings_goal' %}">Save </a></li>
                <li class="nav-item"><a class="nav-link" href="{% url 'transaction_history' %}">Transactions</a></li>
                <li class="nav-item"><a class="nav-link" href="{% url 'dashboard' %}">Dashboard</a></li>
                <li class="nav-item"><a class="nav-link" href="{% url 'scan_message' %}">Scan</a></li>
                <li class="nav-item"><a class="nav-link" href="{% url 'learn' %}">Learn</a></li>
                <li class="nav-item"><a class="nav-link" href="{% url 'submit_feedback' %}">Feedback</a></li>
                <li class="nav-item"><a class="nav-link" href="{% url 'logout' %}">Logout</a></li>
            </ul>
        </div>
    </div>
</nav>

<!-- Main Page Content -->
<div class="container main-container">
    {% for message in messages %}
        <div class="alert alert-{{ message.tags }} shadow-sm">{{ message }}</div>
    {% endfor %}

    {% block content %}{% endblock %}
</div>

<!-- Footer -->
<footer>
    <p>© 2025 Silent Guard. Built by GirlCoders in Uganda. | <a href="#">Privacy Policy</a></p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
