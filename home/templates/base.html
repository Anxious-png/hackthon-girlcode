<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Silent Guard{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #141e30, #243b55);
            color: #f8f9fa;
            min-height: 100vh;
            display: flex;
        }

        /* Sidebar Styling */
        .sidebar {
            width: 240px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            padding-top: 40px;
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            overflow-y: auto;
        }

        .sidebar h2 {
            color: #ffc107;
            text-align: center;
            font-weight: 700;
            margin-bottom: 40px;
        }

        .sidebar a {
            display: block;
            color: #f8f9fa;
            text-decoration: none;
            padding: 12px 20px;
            margin: 6px 15px;
            border-radius: 10px;
            transition: 0.3s;
            font-weight: 500;
        }

        .sidebar a:hover,
        .sidebar a.active {
            background: #ffc107;
            color: #141e30;
            font-weight: bold;
        }

        /* Main Content */
        .main-container {
            margin-left: 250px;
            padding: 30px;
            flex: 1;
        }

        /* Logout button */
        .logout-btn {
            position: fixed;
            top: 20px;
            right: 30px;
            background: #dc3545;
            color: #fff;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: bold;
            transition: 0.3s;
        }

        .logout-btn:hover {
            background: #b02a37;
        }

        /* Alerts */
        .alert {
            border-radius: 12px;
            font-weight: 500;
            margin-bottom: 15px;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 15px;
            color: #ccc;
            font-size: 0.9rem;
            margin-top: 30px;
        }

        footer a {
            color: #ffc107;
            text-decoration: none;
        }

        footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <h2>🚨 Silent Guard</h2>
        <a href="{% url 'savings_dashboard' %}">Dashboard</a>
        <a href="{% url 'set_savings_goal' %}">Save</a>
        <a href="{% url 'transaction_history' %}">Transactions</a>
        <a href="{% url 'dashboard' %}">Fraud Detection</a>
        <a href="{% url 'scan_message' %}">Scan</a>
        <a href="{% url 'learn' %}">Learn</a>
        <a href="{% url 'submit_feedback' %}">Feedback</a>
        <a href="{% url 'add_savings' %}">Add Savings</a>
        <a href="{% url 'withdraw_money' %}">Withdraw</a>
        <a href="{% url 'profile' %}">Profile</a>
        
    </div>

   
    

   
    <div class="main-container">
        {% for message in messages %}
            <div class="alert alert-{{ message.tags }} shadow-sm">{{ message }}</div>
        {% endfor %}

        {% block content %}{% endblock %}

        <footer>
            <p>© 2025 Silent Guard. Built by GirlCoders in Uganda. | <a href="#">Privacy Policy</a></p>
        </footer>
    </div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
